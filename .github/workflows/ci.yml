name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Test & Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install system dependencies (ffmpeg, exiftool)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libimage-exiftool-perl

      - name: Run go vet
        run: go vet ./...

      - name: Run unit & integration tests
        run: |
          set +e
          go test -v ./... > test.log 2>&1
          TEST_EXIT=$?
          grep -E '(FAIL:|--- FAIL|panic:)' -A 5 -B 2 test.log || tail -n 100 test.log
          exit $TEST_EXIT

      - name: Verify cross-compilation
        run: |
          go build -v .
          GOOS=darwin GOARCH=arm64 go build -v .
          GOOS=windows GOARCH=amd64 go build -v .
